name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: supportiq
          POSTGRES_DB: supportiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportiq -d supportiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://supportiq:supportiq@localhost:5432/supportiq_test
      TEST_DATABASE_URL: postgresql+psycopg://supportiq:supportiq@localhost:5432/supportiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app tests
      - run: alembic upgrade head
      - run: pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: supportiq-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
